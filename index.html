<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>推しグッズノート</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff8fb8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="推しノート">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7fa; --card:#fff; --ink:#5a4650; --sub:#b39aa6; --line:#f6e4ec;
  --accent:#ff8fb8; --accent-soft:#ffeef5; --r:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:"Zen Maru Gothic",system-ui,sans-serif;font-weight:500;letter-spacing:.02em}
body{background:var(--bg);min-height:100vh}
#wall{position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--bg)}
#wall .ph{position:absolute;inset:0;background-size:cover;background-position:center}
#wall .ph.blur{inset:-24px;filter:blur(12px)}
#wall .veil{position:absolute;inset:0;background:#fff}
.wp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.wp-tile{aspect-ratio:1;border-radius:16px;border:2px solid var(--line);position:relative;overflow:hidden}
.wp-tile.on{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}
.wp-tile span{position:absolute;left:0;right:0;bottom:0;font-size:10px;font-weight:700;background:rgba(255,255,255,.85);padding:2px 0;text-align:center}
.sw-custom{width:32px;height:32px;border-radius:50%;border:none;padding:0;overflow:hidden;box-shadow:0 0 0 3px #fff,0 0 0 4px var(--line);background:conic-gradient(#ff8fb8,#ffd36e,#a8dba8,#8ccdf0,#b9a2ff,#ff8fb8);position:relative}
.sw-custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.range{width:100%;accent-color:var(--accent)}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.wp-photo{width:100%;aspect-ratio:3/4;max-height:260px;border-radius:20px;background:var(--accent-soft);display:grid;place-items:center;overflow:hidden;color:var(--accent);font-weight:700;font-size:13px;border:2px dashed color-mix(in srgb,var(--accent) 45%,#fff);margin-bottom:14px}
.wp-photo img{width:100%;height:100%;object-fit:cover}
.top .iconbtn+.iconbtn{margin-left:-4px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;padding:0}
img{display:block}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 18px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px)}
.top h1{margin:0;font-size:17px;font-weight:900;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.top h1 .logo{color:var(--accent)}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:16px;background:var(--card);color:var(--accent);flex:none;border:2px solid var(--line)}
.spacer{width:40px;flex:none}
main{max-width:760px;margin:0 auto;padding:6px 18px 120px}
.banner{font-size:12px;color:var(--sub);text-align:center;margin:0 0 14px}
.center{text-align:center;color:var(--sub);padding:60px 0;font-size:14px}

/* home */
.summary{display:flex;justify-content:center;gap:8px;margin:4px 0 22px;flex-wrap:wrap}
.summary div{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:6px 14px;font-size:12px;color:var(--sub)}
.summary b{color:var(--ink);font-size:15px;font-weight:900;margin-right:3px}
.oshi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
@media (max-width:420px){.oshi-grid{grid-template-columns:1fr 1fr}}
.oshi-card{background:var(--card);border-radius:var(--r);border:2px solid var(--line);padding:20px 10px 16px;text-align:center;transition:transform .15s}
.oshi-card:active{transform:scale(.96)}
.avatar{border-radius:50%;display:grid;place-items:center;overflow:hidden;background:color-mix(in srgb,var(--c,var(--accent)) 16%,#fff)}
.avatar img{width:100%;height:100%;object-fit:cover}
.oshi-card .avatar{width:84px;height:84px;margin:0 auto;font-size:32px;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c)}
.oshi-card .nm{font-weight:900;font-size:15px;margin-top:14px;line-height:1.3;word-break:break-word}
.oshi-card .ct{font-size:11.5px;color:var(--sub);margin-top:4px}
.add-card{border:2px dashed color-mix(in srgb,var(--accent) 50%,#fff);background:transparent;color:var(--accent);font-weight:700;font-size:13px;display:grid;place-items:center;min-height:180px}
.add-card .plus{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:24px;margin:0 auto 8px}
.empty{text-align:center;padding:50px 10px}
.empty .big{width:96px;height:96px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-size:42px;margin:0 auto 16px}
.empty h2{font-size:18px;margin:0 0 6px}
.empty p{color:var(--sub);font-size:13px;line-height:1.8;margin:0 0 20px}

/* note */
.hero{text-align:center;margin:4px 0 20px}
.hero .avatar{--c:var(--accent);width:96px;height:96px;margin:0 auto;font-size:38px;box-shadow:0 0 0 4px #fff,0 0 0 7px var(--accent)}
.hero h2{margin:16px 0 2px;font-size:21px;font-weight:900;word-break:break-word}
.hero .wk{font-size:12px;color:var(--sub)}
.hero .stats{display:flex;justify-content:center;gap:6px;margin-top:12px;flex-wrap:wrap}
.hero .stats span{background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:99px;padding:0 16px;margin-bottom:10px;color:var(--sub)}
.search input{border:none;outline:none;background:none;padding:11px 0;width:100%;font-size:14px;color:var(--ink)}
.search input::placeholder{color:var(--sub)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:99px;background:var(--card);font-size:12.5px;border:2px solid var(--line);white-space:nowrap;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.chip.sm{padding:5px 11px;font-size:12px}
.chip-sep{flex:none;width:2px;background:var(--line);border-radius:2px;margin:4px 2px}
.item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
@media (max-width:420px){.item-grid{grid-template-columns:1fr 1fr;gap:10px}}
.item{background:var(--card);border-radius:20px;border:2px solid var(--line);padding:6px;text-align:left;position:relative;transition:transform .15s}
.item:active{transform:scale(.96)}
.item .ph{aspect-ratio:1;border-radius:15px;background:var(--accent-soft);display:grid;place-items:center;font-size:38px;overflow:hidden}
.item .ph img{width:100%;height:100%;object-fit:cover}
.item .qty{position:absolute;top:12px;right:12px;background:#fff;color:var(--accent);font-weight:900;font-size:12px;padding:2px 9px;border-radius:99px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.item .st{position:absolute;top:12px;left:12px}
.st{display:inline-block;font-size:11px;font-weight:900;padding:2px 9px;border-radius:99px;color:#fff}
.st.give{background:#7cc8e8}.st.want{background:#ffb86b}.st.own{background:#8fd6a8}
.item .info{padding:8px 6px 4px}
.item .nm{font-size:13px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .ev{font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.group-h{display:flex;align-items:center;gap:8px;margin:22px 4px 10px;font-weight:900;font-size:14px}
.group-h:first-of-type{margin-top:2px}
.group-h::before{content:"♡";color:var(--accent)}
.group-h small{font-weight:500;color:var(--sub);font-size:11.5px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom));z-index:15;width:62px;height:62px;border-radius:50%;background:var(--accent);color:#fff;font-size:30px;font-weight:500;display:grid;place-items:center;box-shadow:0 0 0 5px #fff,0 8px 20px color-mix(in srgb,var(--accent) 40%,transparent)}
.fab:active{transform:translateX(-50%) scale(.92)}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(90,70,80,.28);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet-wrap[hidden]{display:none}
.sheet{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:30px 30px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));animation:up .24s ease-out}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:30px;padding-top:20px}.sheet::before{display:none}}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
@keyframes fade{from{opacity:0}}
.sheet h3{margin:0 0 18px;font-size:17px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:10px}
.field{margin-bottom:16px}
.field>label{display:block;font-size:12px;font-weight:700;color:var(--sub);margin:0 0 6px 4px}
.field input[type=text],.field input[type=number],.field input[type=date],.field textarea{width:100%;border:2px solid var(--line);border-radius:16px;padding:11px 14px;font-size:15px;outline:none;background:#fffbfd;color:var(--ink)}
.field input:focus,.field textarea:focus{border-color:var(--accent);background:#fff}
.field textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-pick{display:flex;justify-content:center;margin-bottom:18px}
.photo-pick .pv{width:120px;height:120px;border-radius:26px;background:var(--accent-soft);display:grid;place-items:center;font-size:34px;overflow:hidden;position:relative;border:2px dashed color-mix(in srgb,var(--accent) 45%,#fff);color:var(--accent)}
.photo-pick .pv.round{border-radius:50%}
.photo-pick .pv img{width:100%;height:100%;object-fit:cover}
.photo-pick .pv .hint{font-size:11px;font-weight:700;display:block;margin-top:2px}
.photo-pick .rm{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.92);color:var(--ink);font-size:14px;display:grid;place-items:center}
.btn{padding:12px 18px;border-radius:99px;font-weight:700;font-size:14px;background:var(--accent-soft);color:var(--accent);text-align:center}
.btn.main{background:var(--accent);color:#fff}
.btn.ghost{background:#f8f1f4;color:var(--sub)}
.btn.danger{background:#fff0f0;color:#e57373}
.btn:disabled{opacity:.5}
.actions{display:flex;gap:10px;margin-top:8px}
.actions .btn{flex:1;padding:14px}
.actions .btn.danger{flex:0 0 auto}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:20px;font-weight:900}
.stepper input{width:64px!important;text-align:center;font-weight:900;font-size:18px!important;padding:8px!important}
.mini-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mini-chips .chip{padding:4px 11px;font-size:12px}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 3px #fff,0 0 0 4px var(--line)}
.sw.on{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--ink)}
.status-seg{display:flex;gap:6px;background:#f8f1f4;border-radius:99px;padding:4px}
.status-seg button{flex:1;padding:8px;border-radius:99px;font-size:13px;color:var(--sub)}
.status-seg button.on{background:#fff;color:var(--accent);font-weight:900;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.more{font-size:12.5px;color:var(--accent);font-weight:700;margin:2px 0 14px 4px}
.detail-ph{border-radius:24px;overflow:hidden;background:var(--accent-soft);aspect-ratio:1;display:grid;place-items:center;font-size:64px;margin-bottom:16px}
.detail-ph img{width:100%;height:100%;object-fit:contain;background:var(--accent-soft)}
.d-qty{display:flex;justify-content:center;margin-bottom:16px}
.d-qty b{font-size:24px;min-width:48px;text-align:center}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:14px}
.tags span{background:#f8f1f4;border-radius:99px;padding:4px 12px;font-size:12px}
.memo{background:#fffbfd;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;margin-bottom:14px}
.x{font-size:18px;color:var(--sub);width:34px;height:34px;border-radius:50%;background:#f8f1f4;flex:none}
/* tabs & videos */
.tabs{margin:0 0 16px}
.tabs button{font-size:14px;padding:9px}
.vid-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
@media (max-width:420px){.vid-list{grid-template-columns:1fr}}
.vid{display:flex;gap:10px;align-items:stretch;width:100%;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:6px;text-align:left;position:relative;transition:transform .15s;cursor:pointer}
.vid:active{transform:scale(.98)}
.vid .th{width:148px;flex:none;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--accent-soft);position:relative;display:grid;place-items:center;font-size:26px}
.vid .th img{width:100%;height:100%;object-fit:cover}
.vid .th .t{position:absolute;right:5px;bottom:5px;background:rgba(40,25,35,.72);color:#fff;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:8px}
.vid .info{flex:1;min-width:0;padding:3px 30px 3px 0;display:flex;flex-direction:column;gap:3px}
.vid .nm{font-size:13px;font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.vid .sub{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vid .mm{font-size:11.5px;color:var(--ink);opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vid .heart{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:15px;display:grid;place-items:center}
.vid .heart.on{background:var(--accent);color:#fff}
.player{aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:#2a1f25;margin-bottom:14px}
.player iframe{width:100%;height:100%;border:0;display:block}
.v-pv{width:100%;aspect-ratio:16/9;border-radius:20px;overflow:hidden;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);font-size:13px;font-weight:700;margin-bottom:16px}
.v-pv img{width:100%;height:100%;object-fit:cover}
.note-box{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px;text-align:center;font-size:13px;line-height:1.8;color:var(--sub)}
.note-box b{color:var(--ink)}
.note-box .btn{display:inline-block;margin-top:12px}
.howto{font-size:12.5px;line-height:1.8;color:var(--ink);background:#fffbfd;border:2px solid var(--line);border-radius:16px;padding:12px 14px 12px 30px;margin:0 0 16px}
.howto li{margin-bottom:2px}
.small-note{font-size:11.5px;color:var(--sub);line-height:1.7;margin:-8px 4px 14px}
a.btn{text-decoration:none}
/* home new videos */
.sec-h{display:flex;align-items:center;gap:8px;margin:0 4px 10px;font-weight:900;font-size:14px}
.sec-h .cnt{background:#ff5d8f;color:#fff;border-radius:99px;font-size:11px;padding:1px 8px}
.sec-h .chip{margin-left:auto}
.hscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -18px 24px;padding:2px 18px 6px;scroll-snap-type:x mandatory;scroll-padding:0 18px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hv{flex:none;width:196px;scroll-snap-align:start;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:6px 6px 8px;cursor:pointer;position:relative;transition:transform .15s}
.hv:active{transform:scale(.97)}
.hv.unseen{border-color:color-mix(in srgb,var(--c) 55%,#fff)}
.hv .th{aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:color-mix(in srgb,var(--c) 14%,#fff);position:relative}
.hv .th img{width:100%;height:100%;object-fit:cover}
.hv .who{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:900;margin:8px 4px 3px;color:var(--c);min-width:0}
.hv .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hv .who .avatar{width:20px;height:20px;font-size:10px;flex:none;box-shadow:0 0 0 2px var(--c)}
.hv .nm{font-size:12.5px;font-weight:700;line-height:1.4;margin:0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.hv .sub{font-size:10.5px;color:var(--sub);margin:3px 4px 0}
.hv.more-card{display:grid;place-items:center;color:var(--sub);font-size:12px;font-weight:700;width:110px;text-align:center}
.newb{position:absolute;top:6px;left:6px;background:#ff5d8f;color:#fff;font-size:10px;font-weight:900;padding:1px 7px;border-radius:99px;letter-spacing:.06em;box-shadow:0 2px 6px rgba(255,93,143,.35)}
.oshi-card{position:relative}
.nbadge{position:absolute;top:10px;right:10px;background:#ff5d8f;color:#fff;font-size:10.5px;font-weight:900;padding:2px 8px;border-radius:99px;box-shadow:0 2px 6px rgba(255,93,143,.35)}
.home-hint{display:flex;align-items:center;gap:10px;background:var(--card);border:2px dashed var(--line);border-radius:20px;padding:12px 14px;margin:0 0 22px;font-size:12.5px;color:var(--sub);line-height:1.6;text-align:left;width:100%}
.home-hint b{color:var(--accent)}
#toast{position:fixed;left:50%;top:70px;transform:translate(-50%,-10px);background:#fff;color:var(--ink);border:2px solid var(--line);font-size:13px;font-weight:700;padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.06)}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="wall"></div>
<header class="top" id="top"></header>
<main id="app"><div class="center">読み込み中…</div></main>
<div id="sheet" class="sheet-wrap" hidden></div>
<div id="toast"></div>
<input type="file" id="filein" accept="image/*" hidden>

<script>
(() => {
const PRESET_CATS=['缶バッジ','アクスタ','ブロマイド','ぬい','アクキー','キーホルダー','タペストリー','うちわ','ペンライト','CD/DVD','雑誌','その他'];
const CAT_ICON={'缶バッジ':'🔘','アクスタ':'🧍','ブロマイド':'📸','ぬい':'🧸','アクキー':'🔑','キーホルダー':'🔑','タペストリー':'🖼️','うちわ':'🪭','ペンライト':'🔦','CD/DVD':'💿','雑誌':'📖'};
const COLORS=['#ff8fb8','#ff9b9b','#ffb38a','#ffd36e','#a8dba8','#7fd1c7','#8ccdf0','#9bb5ff','#b9a2ff','#e0a3e8','#c4b5a5','#9aa5b1'];
const STATUS={own:'所持',give:'譲',want:'求'};
const LS_KEY='oshi-goods-note-v1';

const VTAG_PRESETS=['歌','MV','配信','切り抜き','ショート','コラボ'];
const YT_KEY_LS='oshi-goods-note-ytkey';

let mode='loading', col=null, assets=null, slow=false;
const data=new Map();
const ui={oshiId:null, ev:'', st:'', q:'', group:false, sort:'new', tab:'goods', vtab:'new', vq:'', vtag:''};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const photoURLs=new Map();
const photoSrc=r=>!r?'':r.startsWith('data:')?r:r.startsWith('idb:')?(photoURLs.get(r)||''):'/_blob/'+r;
const yen=n=>'¥'+Math.round(n||0).toLocaleString('ja-JP');
const icon=c=>CAT_ICON[c]||'🎀';

/* IndexedDB (GitHub Pages など Claude の外で開いたとき) */
const IDB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('oshi-goods-note',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('docs');d.createObjectStore('photos')};r.onsuccess=()=>res(IDB.db=r.result);r.onerror=()=>rej(r.error)})},
  all(store){return new Promise((res,rej)=>{const t=IDB.db.transaction(store);const s=t.objectStore(store);const k=s.getAllKeys(),v=s.getAll();t.oncomplete=()=>res(k.result.map((x,i)=>[x,v.result[i]]));t.onerror=()=>rej(t.error)})},
  put(store,key,val){return new Promise((res,rej)=>{const t=IDB.db.transaction(store,'readwrite');t.objectStore(store).put(val,key);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  del(store,key){return new Promise((res,rej)=>{const t=IDB.db.transaction(store,'readwrite');t.objectStore(store).delete(key);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
};
function loadLocal(){try{const o=JSON.parse(localStorage.getItem(LS_KEY)||'{}');Object.entries(o).forEach(([k,v])=>data.set(k,v))}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(Object.fromEntries(data)))}catch(e){toast('この端末の保存容量がいっぱいです')}}
async function startLocal(){
  try{
    if(!window.indexedDB)throw 0;
    await IDB.open();
    for(const [k,v] of await IDB.all('photos'))photoURLs.set(k,URL.createObjectURL(v));
    for(const [k,v] of await IDB.all('docs'))data.set(k,v);
    mode='idb';

async function put(id,obj){

async function del(id){

function compress(file,max,q){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);const img=new Image();
    img.onload=()=>{let{width:w,height:h}=img;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
      const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      c.toBlob(b=>b?res({blob:b,canvas:c}):rej(new Error('変換失敗')),'image/jpeg',q)};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('画像を読み込めませんでした'))};
    img.src=url;
  });
}
async function uploadPhoto(file){
  if(mode==='idb'){
    const {blob}=await compress(file,1400,.85);
    const ref='idb:'+gid();await IDB.put('photos',ref,blob);photoURLs.set(ref,URL.createObjectURL(blob));return ref;
  }
  if(mode==='db'&&assets){
    const {blob}=await compress(file,1400,.85);
    const r=await assets.upload(blob,{type:'image/jpeg'});
    return r.id;
  }
  const {canvas}=await compress(file,640,.72);
  return canvas.toDataURL('image/jpeg',.72);
}
function dropPhoto(ref){
  if(!ref||ref.startsWith('data:'))return;
  if(ref.startsWith('idb:')){if(IDB.db)IDB.del('photos',ref).catch(()=>{});const u=photoURLs.get(ref);if(u)URL.revokeObjectURL(u);photoURLs.delete(ref);return}
  if(assets)assets.delete(ref).catch(()=>{});
}

const blobToDataURL=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)});
async function exportBackup(){
  const docs=Object.fromEntries(data);const photos={};
  if(mode==='idb')for(const [k,v] of await IDB.all('photos'))photos[k]=await blobToDataURL(v);
  const blob=new Blob([JSON.stringify({app:'oshi-goods-note',version:1,exportedAt:new Date().toISOString(),docs,photos})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='oshi-goods-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast('バックアップを保存したよ');
}
async function importBackup(file){
  try{
    const j=JSON.parse(await file.text());if(!j||j.app!=='oshi-goods-note'||!j.docs)throw 0;
    if(mode==='idb')for(const [k,v] of Object.entries(j.photos||{})){const b=await (await fetch(v)).blob();await IDB.put('photos',k,b);photoURLs.set(k,URL.createObjectURL(b))}
    for(const [k,v] of Object.entries(j.docs)){data.set(k,v);if(mode==='idb')await IDB.put('docs',k,v)}
    if(mode==='local')saveLocal();
    render();closeSheet();toast('読み込みました♡');
  }catch(e){toast('このファイルは読み込めませんでした')}
}
function openBackup(){
  openSheet(`<h3>バックアップ<button class="x" data-close>×</button></h3>
    <p style="font-size:13px;line-height:1.8;color:var(--sub);margin:0 0 16px">データはこの端末のブラウザに保存されています。機種変更やブラウザのデータ削除にそなえて、ときどき書き出しておくと安心です。</p>
    <div class="actions" style="flex-direction:column"><button class="btn main" id="bExp">書き出す（ファイルに保存）</button><button class="btn" id="bImp">ファイルから読み込む</button></div>`);
  $('#bExp').onclick=()=>exportBackup().catch(()=>toast('書き出しに失敗しました'));

async function init(){
  const timer=setTimeout(()=>{if(mode==='loading'){slow=true;render()}},10000);
  try{
    if(!window.claude||typeof window.claude.use!=='function')throw 0;
    const [d,u]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!d||!u)throw 0;
    const uid=await u.id(); if(!uid)throw 0;
    col=d.collection('data/users/'+uid);
    assets=await claude.use('assets').catch(()=>null);
    col.onSnapshot(snap=>{
      if(!snap.metadata.fromCache){clearTimeout(timer);slow=false}
      mode='db';data.clear();snap.docs.forEach(x=>data.set(x.id,x.data()));render();
    },err=>{clearTimeout(timer);slow=false;if(mode==='loading')startLocal();else toast('同期が止まりました。再読み込みしてください')});
  }catch(e){clearTimeout(timer);startLocal()}
}

/* ---------- YouTube ---------- */
const lsGet=k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}};
const lsSet=(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}};
const ytKey=()=>lsGet(YT_KEY_LS);
const ytThumb=id=>`https://i.ytimg.com/vi/${id}/mqdefault.jpg`;
const ytWatch=(id,t)=>`https://www.youtube.com/watch?v=${id}${t?'&t='+t+'s':''}`;
function parseT(v){
  v=String(v||'').trim();if(!v)return 0;
  if(/^\d+$/.test(v))return +v;
  if(/^\d+(:\d{1,2}){1,2}$/.test(v))return v.split(':').reduce((s,x)=>s*60+(+x),0);
  const m=v.match(/^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/i);
  return m?(+(m[1]||0))*3600+(+(m[2]||0))*60+(+(m[3]||0)):0;
}
function fmtT(s){s=Math.max(0,Math.round(+s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,'0');return h?`${h}:${String(m).padStart(2,'0')}:${x}`:`${m}:${x}`}
function parseYT(s){
  s=String(s||'').trim();if(!s)return null;
  if(/^[\w-]{11}$/.test(s))return {id:s,t:0};
  let u;try{u=new URL(/^https?:\/\//.test(s)?s:'https://'+s)}catch(e){return null}
  const h=u.hostname.replace(/^(www|m|music)\./,'');let id=null;
  if(h==='youtu.be')id=u.pathname.slice(1).split('/')[0];
  else if(h==='youtube.com'||h==='youtube-nocookie.com'){
    id=u.searchParams.get('v');
    if(!id){const m=u.pathname.match(/^\/(?:shorts|live|embed|v)\/([\w-]{11})/);if(m)id=m[1]}
  }
  if(!id||!/^[\w-]{11}$/.test(id))return null;
  return {id,t:parseT(u.searchParams.get('t')||u.searchParams.get('start'))};
}
async function fetchTitle(id){
  const url=encodeURIComponent('https://www.youtube.com/watch?v='+id);
  for(const ep of ['https://www.youtube.com/oembed?format=json&url=','https://noembed.com/embed?url=']){
    try{const r=await fetch(ep+url);if(!r.ok)continue;const j=await r.json();if(j&&j.title)return {title:j.title,channel:j.author_name||''}}catch(e){}
  }
  return null;
}
function parseChannel(s){
  s=String(s||'').trim();if(!s)return null;
  const uc=s.match(/(UC[\w-]{22})/);if(uc)return {id:uc[1],label:s};
  const at=s.match(/@([\w.\-　-鿿＀-￯]+)/);if(at)return {handle:'@'+at[1],label:'@'+at[1]};
  if(/^[\w.\-]+$/.test(s))return {handle:'@'+s,label:'@'+s};
  return null;
}
async function ytApi(path,params){
  const k=ytKey();if(!k)throw {code:'nokey'};
  const u=new URL('https://www.googleapis.com/youtube/v3/'+path);
  Object.entries({...params,key:k}).forEach(([a,b])=>u.searchParams.set(a,b));
  let r;try{r=await fetch(u)}catch(e){throw {code:'network'}}
  const j=await r.json().catch(()=>({}));
  if(!r.ok){const e=j.error||{};const reason=(e.errors&&e.errors[0]&&e.errors[0].reason)||(e.details&&e.details[0]&&e.details[0].reason)||'';throw {code:reason||('http'+r.status)}}
  return j;
}
async function uploadsOf(ch){
  if(ch.id)return 'UU'+ch.id.slice(2);
  const ck='oshi-goods-note-ytup:'+ch.handle.toLowerCase();
  const c=lsGet(ck);if(c)return c;
  const j=await ytApi('channels',{part:'contentDetails',forHandle:ch.handle});
  const up=j.items&&j.items[0]&&j.items[0].contentDetails.relatedPlaylists.uploads;
  if(!up)throw {code:'nochannel',ch:ch.label};
  lsSet(ck,up);return up;
}
function ytErr(e){
  const c=(e&&e.code)||'';
  if(c==='nokey')return 'YouTube連携がまだです';
  if(c==='quotaExceeded'||c==='dailyLimitExceeded')return '今日はYouTubeから読み込める回数を使い切りました。明日の夕方ごろに元に戻るよ';
  if(c==='keyInvalid'||c==='API_KEY_INVALID'||c==='badRequest')return '合言葉がちがうみたい。② でコピーした文字をそのまま貼ってね';
  if(/REFERRER|referer|ipRefererBlocked/i.test(c)||c==='forbidden')return 'このサイトでは合言葉が使えない設定になっています。「もっと安心にする設定」の文字が正しく入っているか確認してね';
  if(c==='accessNotConfigured'||c==='SERVICE_DISABLED')return '① の「有効にする」がまだみたい。① のページで青いボタンを押してね（押してから数分かかることもあるよ）';
  if(c==='nochannel')return `チャンネル「${e.ch}」が見つかりませんでした`;
  if(c==='playlistNotFound')return 'チャンネルの動画が見つかりませんでした';
  if(c==='network')return 'つながりませんでした。電波を確認してね';
  return '新着を読み込めませんでした（'+c+'）';
}
const feedCache=new Map();
const FEED_TTL=30*60*1000;
async function loadFeed(o,force){
  const cur=feedCache.get(o.id);
  if(cur&&cur.loading)return;
  if(cur&&!force&&Date.now()-cur.at<FEED_TTL)return;
  feedCache.set(o.id,{loading:true,at:0,items:cur&&cur.items||[]});
  const chans=(o.channels||[]).map(parseChannel).filter(Boolean);
  const res=await Promise.allSettled(chans.map(async ch=>{
    const pl=await uploadsOf(ch);
    const j=await ytApi('playlistItems',{part:'snippet,contentDetails',maxResults:15,playlistId:pl});
    return (j.items||[]).filter(x=>x.snippet&&!/^(Private|Deleted) video$/.test(x.snippet.title)).map(x=>({
      id:x.contentDetails.videoId,title:x.snippet.title,
      channel:x.snippet.videoOwnerChannelTitle||x.snippet.channelTitle||'',
      at:x.contentDetails.videoPublishedAt||x.snippet.publishedAt||''}));
  }));
  const seen=new Set(),items=[];
  res.forEach(r=>r.status==='fulfilled'&&r.value.forEach(v=>{if(!seen.has(v.id)){seen.add(v.id);items.push(v)}}));
  items.sort((a,b)=>(b.at||'').localeCompare(a.at||''));
  const errs=res.filter(r=>r.status==='rejected').map(r=>ytErr(r.reason));
  feedCache.set(o.id,{at:Date.now(),items:items.slice(0,40),errs,failed:!!errs.length&&!items.length});
  if(!ui.oshiId||(ui.oshiId===o.id&&ui.tab==='video'&&ui.vtab==='new'))render();
}
/* 新着の「NEW」管理（この端末だけ） */
const SEEN_LS='oshi-goods-note-ytseen',OPENED_LS='oshi-goods-note-ytopened',NEW_WINDOW=3*864e5;
let seen={};try{seen=JSON.parse(lsGet(SEEN_LS)||'{}')||{}}catch(e){}
let opened=new Set();try{opened=new Set(JSON.parse(lsGet(OPENED_LS)||'[]'))}catch(e){}
function isNew(oid,v,base=seen[oid]){
  if(opened.has(v.id))return false;
  const t=Date.parse(v.at)||0;
  return base?t>(Date.parse(base)||0):Date.now()-t<NEW_WINDOW;
}
function markOpened(vid){if(opened.has(vid))return;opened.add(vid);lsSet(OPENED_LS,JSON.stringify([...opened].slice(-300)))}
function markSeen(oid){const f=feedCache.get(oid);if(!f||!f.items.length)return;if(seen[oid]===f.items[0].at)return;seen[oid]=f.items[0].at;lsSet(SEEN_LS,JSON.stringify(seen))}
const feedOshis=()=>oshis().filter(o=>(o.channels||[]).length);
function ensureFeeds(){if(!ytKey())return;for(const o of feedOshis()){const f=feedCache.get(o.id);if(!f||(!f.loading&&Date.now()-f.at>=FEED_TTL))setTimeout(()=>loadFeed(o),0)}}
const newCount=oid=>{const f=feedCache.get(oid);return f?f.items.filter(v=>isNew(oid,v)).length:0};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&mode!=='loading')render()});
function ago(iso){
  const t=Date.parse(iso);if(!t)return '';
  const m=Math.floor((Date.now()-t)/60000);
  if(m<60)return Math.max(1,m)+'分前';
  if(m<1440)return Math.floor(m/60)+'時間前';
  if(m<43200)return Math.floor(m/1440)+'日前';
  return new Date(t).toLocaleDateString('ja-JP');
}

/* ---------- wallpaper ---------- */
const PATTERNS=[['dots','ドット'],['stripe','ストライプ'],['gingham','ギンガム'],['heart','ハート'],['star','ほし'],['grad','グラデ'],['plain','むじ'],['oshis','みんなの推し色']];
const DEFAULT_BG={type:'pattern',pat:'dots',color:null};
const settings=()=>data.get('app-settings')||{};
const STAR=(()=>{const p=[];for(let i=0;i<10;i++){const r=i%2?3.2:7.5,a=Math.PI/5*i-Math.PI/2;p.push((20+r*Math.cos(a)).toFixed(1)+' '+(20+r*Math.sin(a)).toFixed(1))}return 'M'+p.join('L')+'Z'})();
const HEART='M20 27.5C12.5 22 11.5 18.3 13.3 15.8C15.2 13.3 18.6 13.7 20 16.3C21.4 13.7 24.8 13.3 26.7 15.8C28.5 18.3 27.5 22 20 27.5Z';
function svgTile(path,c){return `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><path d='${path}' fill='${c}' fill-opacity='.24'/></svg>`)}")`}
function wallCss(pat,c){
  const mix=p=>`color-mix(in srgb,${c} ${p}%,#fff)`,tr=p=>`color-mix(in srgb,${c} ${p}%,transparent)`;
  switch(pat){
    case 'stripe':return `repeating-linear-gradient(135deg,${mix(14)} 0 16px,${mix(4)} 16px 32px)`;
    case 'gingham':return `linear-gradient(90deg,${tr(14)} 50%,transparent 0) 0 0/32px 32px,linear-gradient(${tr(14)} 50%,transparent 0) 0 0/32px 32px,${mix(3)}`;
    case 'heart':case 'star':{const t=svgTile(pat==='heart'?HEART:STAR,c);return `${t} 0 0/44px 44px,${t} 22px 22px/44px 44px,${mix(5)}`}
    case 'grad':return `linear-gradient(165deg,${mix(34)} 0%,${mix(9)} 45%,#fff 68%,${mix(22)} 100%)`;
    case 'plain':return mix(10);
    case 'oshis':{const cs=[...new Set(oshis().map(o=>o.color).filter(Boolean))];if(cs.length<2)return wallCss('grad',cs[0]||c);
      return `linear-gradient(160deg,${cs.map((x,i)=>`color-mix(in srgb,${x} 28%,#fff) ${Math.round(i/(cs.length-1)*100)}%`).join(',')})`}
    default:return `radial-gradient(${tr(24)} 1.3px,transparent 1.4px) 0 0/22px 22px,${mix(5)}`;
  }
}

      if(cur.pat!=='oshis')h+=`<div class="field"><label>カラー</label><div class="swatches">
        <button type="button" class="sw ${!pc?'on':''}" data-wc="" style="background:${accent}" title="${o?'推しカラー':'標準'}"></button>
        ${COLORS.filter(c=>c!==accent).map(c=>`<button type="button" class="sw ${pc===c?'on':''}" style="background:${c}" data-wc="${c}"></button>`).join('')}
        <label class="sw-custom ${pc&&!COLORS.includes(pc)?'on':''}" title="自由に選ぶ"><input type="color" id="wcc" value="${esc(pc||accent)}"></label></div>
        ${o?`<p class="small-note" style="margin:8px 4px 0">いちばん左は「推しカラー」。推しの色を変えると壁紙もいっしょに変わるよ</p>`:''}</div>`;
    }else{
      const src=prevUrl||photoSrc(cur.photo);
      h+=`<button type="button" class="wp-photo" id="wpPick">${src?`<img src="${esc(src)}" alt="">`:'📷 タップして写真をえらぶ'}</button>
      <div class="field"><label>白いベールの濃さ（文字を読みやすく）</label><input type="range" class="range" id="wveil" min="0" max="85" value="${Math.round((cur.veil??.45)*100)}"></div>
      <div class="field"><label class="toggle"><input type="checkbox" id="wblur" ${cur.blur?'checked':''}> ぼかす</label></div>`;
    }
    h+=`<div class="actions"><button type="button" class="btn ghost" id="wReset">${target?'全体と同じにする':'はじめの柄に戻す'}</button><button type="button" class="btn main" id="wSave">保存</button></div>`;
    const box=!sheet.hidden&&sheet.querySelector('.sheet.wp');
    if(box)box.innerHTML=h;else{openSheet(h);sheet.querySelector('.sheet').classList.add('wp')}
    sheetOnClose=()=>{wallKey='';render()};
    sheet.querySelectorAll('[data-wt]').forEach(b=>b.onclick=()=>{target=b.dataset.wt;load();preview();draw()});
    sheet.querySelectorAll('[data-wm]').forEach(b=>b.onclick=()=>{
      if(b.dataset.wm==='photo'&&shown().type!=='photo'){st={type:'photo',photo:null,veil:.45,blur:false};pickPhoto(f=>{file=f;prevUrl=URL.createObjectURL(f);preview();draw()})}
      if(b.dataset.wm==='pattern'&&shown().type!=='pattern')st={type:'pattern',pat:'dots',color:null};
      preview();draw();
    });
    sheet.querySelectorAll('[data-wp]').forEach(b=>b.onclick=()=>{st={type:'pattern',pat:b.dataset.wp,color:(shown().type==='pattern'&&shown().color)||null};preview();draw()});
    sheet.querySelectorAll('[data-wc]').forEach(b=>b.onclick=()=>{st={type:'pattern',pat:shown().pat||'dots',color:b.dataset.wc||null};preview();draw()});
    const cc=$('#wcc');if(cc){cc.oninput=()=>{st={type:'pattern',pat:shown().pat||'dots',color:cc.value};preview()};cc.onchange=()=>draw()}
    const pk=$('#wpPick');if(pk)pk.onclick=()=>pickPhoto(f=>{file=f;prevUrl=URL.createObjectURL(f);st={...shown(),type:'photo'};preview();draw()});
    const vl=$('#wveil');if(vl)vl.oninput=()=>{st={...shown(),veil:+vl.value/100};preview()};
    const bl=$('#wblur');if(bl)bl.onchange=()=>{st={...shown(),blur:bl.checked};preview()};
    $('#wReset').onclick=()=>{st=null;file=null;prevUrl='';preview();draw()};
    $('#wSave').onclick=async()=>{
      const btn=$('#wSave');
      if(st&&st.type==='photo'&&!file&&!st.photo){toast('写真をえらんでね');return}
      btn.disabled=true;btn.textContent='保存中…';
      try{
        let bg=st?{...st}:null;
        if(bg&&bg.type==='photo'){if(file)bg.photo=await uploadPhoto(file);bg={type:'photo',photo:bg.photo,veil:bg.veil??.45,blur:!!bg.blur}}
        else if(bg)bg={type:'pattern',pat:bg.pat||'dots',color:bg.color||null};
        const old=stored(target);
        if(!o)await put('app-settings',{...settings(),kind:'settings',homeBg:bg});
        else{
          const cur=data.get(oid);
          if(target){const ev={...(cur.evBg||{})};if(bg)ev[target]=bg;else delete ev[target];await put(oid,{...cur,evBg:ev})}
          else await put(oid,{...cur,bg})
        }
        if(old&&old.type==='photo'&&old.photo&&(!bg||bg.photo!==old.photo))dropPhoto(old.photo);
        sheetOnClose=null;closeSheet();wallKey='';render();toast('壁紙をかえたよ✨');
      }catch(err){btn.disabled=false;btn.textContent='保存';toast(saveErr(err))}
    };
  };
  draw();preview();
}

/* ---------- routing ---------- */
function readHash(){const h=location.hash.slice(1);ui.oshiId=h.startsWith('o-')?h.slice(2):null}
function go(oid){ui.oshiId=oid;ui.ev='';ui.st='';ui.q='';ui.vq='';ui.vtag='';ui.snapFor=null;try{location.hash=oid?'o-'+oid:''}catch(e){}render();window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{readHash();render()});

/* ---------- render ---------- */
function render(){
  const o=ui.oshiId&&data.get(ui.oshiId);
  if(ui.oshiId&&mode!=='loading'&&(!o||o.kind!=='oshi'))ui.oshiId=null;
  document.documentElement.style.setProperty('--accent',(o&&o.color)||'#ff8fb8');
  document.documentElement.style.setProperty('--accent-soft',`color-mix(in srgb,${(o&&o.color)||'#ff8fb8'} 14%,#fff)`);
  if(sheet.hidden||!sheet.querySelector('.sheet.wp')){const w=currentWall();applyWall(w.bg,w.accent)}
  if(mode==='loading'){$('#top').innerHTML=`<h1><span class="logo">♡</span> 推しグッズノート</h1>`;$('#app').innerHTML=`<div class="center">${slow?'保存先に接続できるまで待っています…':'読み込み中…'}</div>`;return}
  ui.oshiId?renderNote({id:ui.oshiId,...o}):renderHome();
}
function bannerHtml(){
  if(mode==='local'||mode==='idb')return '';
  return '';
}
function av(o,emoji){return `<div class="avatar" style="--c:${esc(o.color||'#ff8fb8')}">${o.photo?`<img src="${esc(photoSrc(o.photo))}" alt="">`:emoji}</div>`}
function renderHome(){
  $('#top').innerHTML=`<span class="spacer"></span><h1><span class="logo">♡</span> 推しグッズノート <span class="logo">♡</span></h1><button class="iconbtn" data-act="wall" aria-label="壁紙">🖼</button>`;
  const list=oshis();

    h+=`<div class="empty"><div class="big">🎀</div><h2>推しノートをつくろう</h2><p>推しごとにグッズを<br>写真つきで記録できるよ</p><button class="btn main" data-act="new-oshi">＋ 推しを登録</button></div>`;
  }else{
    h+=`<div class="summary"><div><b>${list.length}</b>推し</div><div><b>${sumQty(allItems)}</b>グッズ</div></div>`;
    h+=homeNewHtml();

    for(const o of list){
      const its=itemsOf(o.id);const nc=newCount(o.id);
      h+=`<button class="oshi-card" style="--c:${esc(o.color||'#ff8fb8')}" data-go="${o.id}">${nc?`<span class="nbadge">NEW ${nc}</span>`:''}${av(o,'💗')}
        <div class="nm">${esc(o.name)}</div><div class="ct">${sumQty(its)}こ</div></button>`;
    }
    h+=`<button class="oshi-card add-card" data-act="new-oshi"><div><div class="plus">＋</div>推しを追加</div></button></div>`;
  }
  h+=`<div style="display:flex;gap:8px;justify-content:center;margin-top:28px">${mode!=='db'?`<button class="chip sm" data-act="backup">💾 バックアップ</button>`:''}<button class="chip sm" data-act="yt-key">▶ YouTube連携</button></div>`;
  const hs=$('.hscroll'),sl=hs?hs.scrollLeft:0;
  $('#app').innerHTML=h;
  if(sl&&$('.hscroll'))$('.hscroll').scrollLeft=sl;

function homeNewHtml(){
  const fo=feedOshis();if(!fo.length)return '';
  if(!ytKey())return `<button class="home-hint" data-act="yt-key"><span style="font-size:22px">▶</span><span><b>YouTube連携</b>をすると、推しの新着動画がここに並ぶよ（無料・5分）</span></button>`;
  ensureFeeds();
  const all=[];
  for(const o of fo){const f=feedCache.get(o.id);if(f)f.items.forEach(v=>all.push({o,v,n:isNew(o.id,v)}))}
  const loading=fo.some(o=>{const f=feedCache.get(o.id);return !f||f.loading});
  const nNew=all.filter(x=>x.n).length;
  let h=`<div class="sec-h">🆕 推しの新着${nNew?`<span class="cnt">${nNew}</span>`:''}${nNew?`<button class="chip sm" data-act="read-all">すべて既読</button>`:''}</div>`;
  if(!all.length)return h+`<div class="home-hint" style="border-style:solid">${loading?'新着を読み込み中…':'新着を読み込めませんでした。推しのノートの「▶ 動画」で確認してね'}</div>`;
  all.sort((a,b)=>(b.n-a.n)||(b.v.at||'').localeCompare(a.v.at||''));
  const shown=all.slice(0,Math.max(12,nNew));
  h+=`<div class="hscroll">${shown.map(({o,v,n})=>`<div class="hv ${n?'unseen':''}" style="--c:${esc(o.color||'#ff8fb8')}" data-feed="${esc(v.id)}" data-oid="${o.id}" role="button" tabindex="0">
    <div class="th"><img src="${ytThumb(v.id)}" alt="" loading="lazy">${n?'<span class="newb">NEW</span>':''}</div>
    <div class="who">${av(o,'💗')}<span>${esc(o.name)}</span></div>
    <div class="nm">${esc(v.title)}</div><div class="sub">${esc(ago(v.at))}</div></div>`).join('')}</div>`;
  return h;
}
function renderNote(o){
  $('#top').innerHTML=`<button class="iconbtn" data-act="back" aria-label="戻る">‹</button><h1>${esc(o.name)}</h1><button class="iconbtn" data-act="wall" aria-label="壁紙">🖼</button><button class="iconbtn" data-act="edit-oshi" aria-label="推しを編集">✎</button>`;
  const all=itemsOf(o.id);
  const events=[...new Set(all.map(i=>(i.event||'').trim()).filter(Boolean))];
  let list=all.filter(i=>(!ui.ev||(i.event||'').trim()===ui.ev)&&(!ui.st||(i.status||'own')===ui.st));
  if(ui.q){const q=ui.q.toLowerCase();list=list.filter(i=>[i.name,i.event,i.category,i.memo].join(' ').toLowerCase().includes(q))}
  list.sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));
  const vids=vidsOf(o.id);
  let h=bannerHtml();
  h+=`<div class="hero">${av(o,'💗')}<h2>${esc(o.name)}</h2>${o.work?`<div class="wk">${esc(o.work)}</div>`:''}
    <div class="stats"><span>${sumQty(all)}こ</span><span>${all.length}しゅるい</span>${vids.length?`<span>▶ ${vids.length}本</span>`:''}</div></div>`;
  h+=`<div class="status-seg tabs"><button class="${ui.tab==='goods'?'on':''}" data-tab="goods">🎀 グッズ</button><button class="${ui.tab==='video'?'on':''}" data-tab="video">▶ 動画</button></div>`;
  if(ui.tab==='video'){
    h+=videoHtml(o,vids);
    h+=`<button class="fab" data-act="new-video" aria-label="動画を保存">＋</button>`;
    $('#app').innerHTML=h;
    const vq=$('#vq');if(vq&&ui._focusQ){vq.focus();vq.setSelectionRange(vq.value.length,vq.value.length)}
    return;
  }
  if(!all.length){
    h+=`<div class="empty" style="padding-top:20px"><p>まだグッズがないよ<br>下の ＋ から登録してね</p></div>`;
  }else{
    h+=`<label class="search">🔍<input id="q" type="text" placeholder="さがす" value="${esc(ui.q)}"></label>`;
    h+=`<div class="chips"><button class="chip sm ${!ui.group?'on':''}" data-group="0">一覧</button><button class="chip sm ${ui.group?'on':''}" data-group="1">イベント別</button>
      <span class="chip-sep"></span>${[['own','所持'],['give','譲'],['want','求']].map(([k,l])=>`<button class="chip sm ${ui.st===k?'on':''}" data-st="${ui.st===k?'':k}">${l}</button>`).join('')}
      ${!ui.group&&events.length?`<span class="chip-sep"></span>${events.map(e=>`<button class="chip sm ${ui.ev===e?'on':''}" data-ev="${ui.ev===e?'':esc(e)}">${esc(e)}</button>`).join('')}`:''}
      ${ui.ev?`<span class="chip-sep"></span><button class="chip sm" data-act="wall">🖼 このイベントの壁紙</button>`:''}</div>`;
    if(!list.length)h+=`<div class="center">見つからなかったよ</div>`;
    else if(ui.group){
      const groups=new Map();list.forEach(i=>{const k=(i.event||'').trim()||'イベントなし';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(i)});
      for(const [k,arr] of groups)h+=`<div class="group-h">${esc(k)}<small>${sumQty(arr)}こ</small></div><div class="item-grid">${arr.map(itemCard).join('')}</div>`;
    }else h+=`<div class="item-grid">${list.map(itemCard).join('')}</div>`;

}
function itemCard(i){
  const st=i.status||'own';
  return `<button class="item" data-item="${i.id}"><div class="ph">${i.photo?`<img src="${esc(photoSrc(i.photo))}" alt="" loading="lazy">`:icon(i.category)}</div>
    <span class="qty">×${+i.qty||0}</span>${st!=='own'?`<span class="st ${st}">${STATUS[st]}</span>`:''}
    <div class="info"><div class="nm">${esc(i.name)}</div>${i.event?`<div class="ev">${esc(i.event)}</div>`:''}</div></button>`;

function videoHtml(o,vids){
  let h=`<div class="chips"><button class="chip sm ${ui.vtab==='new'?'on':''}" data-vtab="new">🆕 新着</button><button class="chip sm ${ui.vtab==='fav'?'on':''}" data-vtab="fav">♡ お気に入りノート <b style="margin-left:2px">${vids.length}</b></button>`;
  if(ui.vtab==='new'&&(o.channels||[]).length&&ytKey())h+=`<span class="chip-sep"></span><button class="chip sm" data-act="feed-reload">↻ 更新</button>`;
  h+=`</div>`;
  if(ui.vtab==='fav')return h+favHtml(vids);
  const chans=o.channels||[];
  if(!chans.length)return h+`<div class="note-box"><b>推しのYouTubeチャンネル</b>を登録すると<br>最新の動画が新しい順に並ぶよ<br><button class="btn main" data-act="edit-oshi">チャンネルを登録</button></div>`;
  if(!ytKey())return h+`<div class="note-box">新着を見るには、最初に1回だけ<br><b>YouTube連携</b>の準備をしてね（無料・5分）<br><button class="btn main" data-act="yt-key">連携する</button><br><a class="btn" style="margin-top:8px" href="${esc(chanUrl(chans[0]))}" target="_blank" rel="noopener">YouTubeでチャンネルを開く</a></div>`;
  const f=feedCache.get(o.id);
  if(!f||(!f.loading&&Date.now()-f.at>=FEED_TTL))setTimeout(()=>loadFeed(o),0);
  if(!f||(f.loading&&!f.items.length))return h+`<div class="center">新着を読み込み中…</div>`;
  if(f.failed)return h+`<div class="note-box">${esc(f.errs[0])}<br><button class="btn" data-act="feed-reload">もう一度</button>${/合言葉|連携|有効/.test(f.errs[0])?` <button class="btn main" data-act="yt-key">連携を確認</button>`:''}</div>`;
  if(f.errs&&f.errs.length)h+=`<p class="small-note">⚠ ${esc(f.errs[0])}</p>`;
  if(!f.items.length)return h+`<div class="center">まだ動画がないみたい</div>`;
  const saved=new Set(vids.map(v=>v.videoId));
  // 開いた時点の「既読ライン」を覚えておき、この画面ではNEWを残したまま次回からは既読にする
  if(ui.snapFor!==o.id){ui.snapFor=o.id;ui.snap=seen[o.id]||null}
  markSeen(o.id);
  return h+`<div class="vid-list">${f.items.map(v=>`<div class="vid" data-feed="${esc(v.id)}" data-oid="${o.id}" role="button" tabindex="0">
    <div class="th"><img src="${ytThumb(v.id)}" alt="" loading="lazy">${isNew(o.id,v,ui.snap)?'<span class="newb">NEW</span>':''}</div>
    <div class="info"><div class="nm">${esc(v.title)}</div><div class="sub">${esc(ago(v.at))}${chans.length>1?' ・ '+esc(v.channel):''}</div></div>
    <button class="heart ${saved.has(v.id)?'on':''}" data-vfav="${esc(v.id)}" data-oid="${o.id}" aria-label="お気に入りに保存">${saved.has(v.id)?'♥':'♡'}</button></div>`).join('')}</div>`;
}
function chanUrl(s){const c=parseChannel(s);if(!c)return 'https://www.youtube.com/';return c.id?'https://www.youtube.com/channel/'+c.id:'https://www.youtube.com/'+encodeURIComponent(c.handle).replace('%40','@')}
function favHtml(vids){
  if(!vids.length)return `<div class="empty" style="padding-top:20px"><p>まだ動画がないよ<br>下の ＋ からURLを貼るか<br>新着の ♡ で保存してね</p></div>`;
  const tags=[...new Set(vids.map(v=>(v.tag||'').trim()).filter(Boolean))];
  let list=vids.filter(v=>!ui.vtag||(v.tag||'').trim()===ui.vtag);
  if(ui.vq){const q=ui.vq.toLowerCase();list=list.filter(v=>[v.title,v.channel,v.tag,v.memo].join(' ').toLowerCase().includes(q))}
  list.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  let h=`<label class="search">🔍<input id="vq" type="text" placeholder="動画をさがす" value="${esc(ui.vq)}"></label>`;
  if(tags.length)h+=`<div class="chips">${tags.map(t=>`<button class="chip sm ${ui.vtag===t?'on':''}" data-vtag="${ui.vtag===t?'':esc(t)}">${esc(t)}</button>`).join('')}</div>`;
  if(!list.length)return h+`<div class="center">見つからなかったよ</div>`;
  return h+`<div class="vid-list">${list.map(v=>`<button class="vid" data-video="${v.id}">
    <div class="th"><img src="${ytThumb(v.videoId)}" alt="" loading="lazy">${v.start?`<span class="t">▶ ${fmtT(v.start)}</span>`:''}</div>
    <div class="info" style="padding-right:4px"><div class="nm">${esc(v.title||'（タイトルなし）')}</div>
    <div class="sub">${[v.tag,v.channel].filter(Boolean).map(esc).join(' ・ ')}</div>${v.memo?`<div class="mm">${esc(v.memo)}</div>`:''}</div></button>`).join('')}</div>`;
}

function pickPhoto(cb){const f=$('#filein');f.value='';f.onchange=()=>{if(f.files[0])cb(f.files[0])};f.click()}
const emptyPv=emoji=>`<div>${emoji}<span class="hint">写真を追加</span></div>`;
function photoField(cur,round,emoji){

function wirePhoto(state,emoji,cur){

  if(cur)addRm();

async function resolvePhoto(state,old){
  if(state.file)return await uploadPhoto(state.file);
  if(state.removed)return null;

}

async function ytCheck(key){
  try{
    const r=await fetch('https://www.googleapis.com/youtube/v3/channels?part=id&forHandle=%40YouTube&key='+encodeURIComponent(key));
    if(r.ok)return null;
    const j=await r.json().catch(()=>({}));const e=j.error||{};
    return {code:(e.errors&&e.errors[0]&&e.errors[0].reason)||(e.details&&e.details[0]&&e.details[0].reason)||('http'+r.status)};
  }catch(e){return {code:'network'}}
}
function openYtKey(){

  const step=(n,t,body)=>`<div style="display:flex;gap:12px;margin-bottom:16px"><div style="flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-weight:900;display:grid;place-items:center;font-size:14px">${n}</div><div style="flex:1;min-width:0"><div style="font-weight:900;font-size:14.5px;margin:3px 0 4px">${t}</div><div style="font-size:12.5px;line-height:1.8;color:var(--sub)">${body}</div></div></div>`;

    <p style="font-size:13px;line-height:1.8;margin:0 0 18px">推しの新着動画を自動で集めるために、Googleから<b>「合言葉」</b>をもらって、ここに貼ります。<br><span style="color:var(--sub)">無料・最初に1回だけ・5分くらい。お気に入りノートだけなら準備はいりません。</span></p>
    ${k?`<div class="note-box" style="margin-bottom:16px">✅ <b>連携ずみ</b>です。合言葉を変えるときだけ ③ をやり直してね</div>`:''}
    ${step('1','YouTubeの機能をオンにする',`下のボタンでGoogleのページを開き、ふだんのGoogleアカウントでログイン。<br>青い<b>「有効にする」</b>ボタンを押します。<br>（はじめてだと「プロジェクトを作成」と出るので、名前はそのままで作成 → もう一度このボタンから開いてね）
      <a class="btn" style="display:block;width:fit-content;margin-top:8px" href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank" rel="noopener">① のページを開く ↗</a>`)}
    ${step('2','合言葉をつくる',`ページ上の<b>「＋ 認証情報を作成」</b>→<b>「APIキー」</b>を押すと、<b>AIza</b>ではじまる文字が出ます。それをコピー。
      <a class="btn" style="display:block;width:fit-content;margin-top:8px" href="https://console.cloud.google.com/apis/credentials" target="_blank" rel="noopener">② のページを開く ↗</a>`)}
    ${step('3','ここに貼る',`<input type="text" id="ytk" autocomplete="off" spellcheck="false" value="${esc(k)}" placeholder="AIza… をここに貼りつけ" style="width:100%;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:14px;outline:none;background:#fffbfd;color:var(--ink);margin-top:2px">
      <div id="ytMsg" style="margin-top:6px"></div>`)}
    <div class="actions">${k?`<button class="btn danger" id="ytDel">連携をやめる</button>`:''}<button class="btn main" id="ytSave">たしかめて保存</button></div>
    ${site?`<details style="margin-top:18px;font-size:12.5px;line-height:1.8;color:var(--sub)"><summary style="cursor:pointer;font-weight:700;color:var(--ink)">🔒 もっと安心にする設定（おすすめ・あとででOK）</summary>
      <p style="margin:8px 0">合言葉を他のサイトで使われないように、② のページで作ったキーの名前を押して、<b>「ウェブサイト」</b>を選び、下の文字を追加して保存します。</p>
      <div style="display:flex;gap:8px;align-items:center"><code style="flex:1;min-width:0;overflow:auto;background:#f8f1f4;border-radius:10px;padding:8px 10px;white-space:nowrap">${esc(site)}</code><button class="btn" id="ytCopy" style="padding:8px 14px">コピー</button></div></details>`:''}
    <p class="small-note" style="margin-top:14px">合言葉はこの端末にだけ保存されます（バックアップやGitHubには入りません）。スマホとPCで使うなら、それぞれに貼ってね。</p>`);
  const msg=t=>{$('#ytMsg').innerHTML=t};
  $('#ytSave').onclick=async()=>{
    const v=$('#ytk').value.trim().replace(/\s/g,'');
    if(!v){msg('<span style="color:#e57373;font-size:12.5px">② でコピーした文字を貼ってね</span>');return}
    const btn=$('#ytSave');btn.disabled=true;btn.textContent='たしかめ中…';
    const err=await ytCheck(v);
    btn.disabled=false;btn.textContent='たしかめて保存';
    if(err){msg(`<span style="color:#e57373;font-size:12.5px;line-height:1.7;display:block">${esc(ytErr(err))}</span>`);return}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-go],[data-item],[data-ev],[data-st],[data-group],[data-close],[data-tab],[data-vtab],[data-vtag],[data-video],[data-vfav],[data-feed]');if(!t)return;
  if(t.hasAttribute('data-close'))return closeSheet();
  if(t.dataset.tab){ui.tab=t.dataset.tab;return render()}
  if(t.dataset.vtab){ui.vtab=t.dataset.vtab;return render()}
  if(t.dataset.vtag!==undefined){ui.vtag=t.dataset.vtag;return render()}
  if(t.dataset.video)return openVideoDetail(t.dataset.video);
  if(t.dataset.vfav)return quickFav(t.dataset.oid||ui.oshiId,t.dataset.vfav);
  if(t.dataset.feed)return openFeedPlayer(t.dataset.oid||ui.oshiId,t.dataset.feed);
  if(t.dataset.go)return go(t.dataset.go);
  if(t.dataset.item)return openDetail(t.dataset.item);
  if(t.closest('#app')&&t.dataset.ev!==undefined){ui.ev=t.dataset.ev;return render()}
  if(t.closest('#app')&&t.dataset.st!==undefined){ui.st=t.dataset.st;return render()}
  if(t.dataset.group!==undefined){ui.group=t.dataset.group==='1';if(ui.group)ui.ev='';return render()}
  const a=t.dataset.act;
  if(a==='new-oshi')openOshiForm();
  else if(a==='back')go(null);
  else if(a==='edit-oshi')openOshiForm(ui.oshiId);
  else if(a==='new-item')openItemForm(ui.oshiId);
  else if(a==='backup')openBackup();
  else if(a==='new-video')openVideoForm(ui.oshiId);
  else if(a==='read-all'){feedOshis().forEach(o=>markSeen(o.id));render();toast('ぜんぶ既読にしたよ')}
  else if(a==='yt-key')openYtKey();
  else if(a==='wall')openWall();
  else if(a==='feed-reload'){const o=data.get(ui.oshiId);if(o){loadFeed({id:ui.oshiId,...o},true);render()}}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ui.q=e.target.value;ui._focusQ=true;render();ui._focusQ=false}
  if(e.target.id==='vq'){ui.vq=e.target.value;ui._focusQ=true;render();ui._focusQ=false}
});
document.addEventListener('change',e=>{});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.hidden)closeSheet()});

readHash();render();init();
})();
</script>
</body>
</html>
